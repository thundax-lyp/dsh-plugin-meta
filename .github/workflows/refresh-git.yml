name: Refresh GitHub META

on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both workflows publish to the same branch; serialize writers without coupling their steps.
concurrency:
  group: meta-snapshot-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check GitHub collector
        run: npm run check:git

      - name: Import GitHub source manifest
        id: import_source
        continue-on-error: true
        run: npm run import:git

      - name: Refresh stale GitHub metrics
        id: refresh_metrics
        continue-on-error: true
        run: npm run refresh:git -- --max-count 2000

      - name: Validate Git snapshots
        run: npm run validate:git

      - name: Commit GitHub snapshots
        run: |
          git add -- data/GIT-MANIFEST.jsonl data/GIT-META.jsonl data/GIT-PENDING.jsonl data/GIT-ERRORS.jsonl
          if git diff --cached --quiet; then
            echo "GitHub META is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data(repo/git): 刷新 GitHub 清单与指标"
          git push

      - name: Report collection failures after preserving progress
        if: steps.import_source.outcome == 'failure' || steps.refresh_metrics.outcome == 'failure'
        run: exit 1
