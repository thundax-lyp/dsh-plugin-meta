name: Refresh npm META

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-meta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Refresh stale packages
        run: npm run refresh:meta -- --max-count 2000

      - name: Commit refreshed META
        run: |
          if git diff --quiet -- data/META.jsonl; then
            echo "META is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/META.jsonl
          git commit -m "Data(repo/meta): 刷新 npm META 快照"
          git push
