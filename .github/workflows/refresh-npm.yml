name: Refresh npm META

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Both workflows publish to the same branch; serialize writers without coupling their steps.
concurrency:
  group: meta-snapshot-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check npm collector
        run: npm run check:npm

      - name: Import npm source manifest
        id: import_source
        continue-on-error: true
        run: npm run import:npm

      - name: Refresh stale npm metrics
        id: refresh_metrics
        continue-on-error: true
        run: npm run refresh:npm -- --max-count 2000

      - name: Commit npm snapshots
        run: |
          git add -- data/NPM-MANIFEST.jsonl data/NPM-META.jsonl
          if git diff --cached --quiet; then
            echo "npm META is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data(repo/npm): 刷新 npm 清单与指标"
          git push

      - name: Report collection failures after preserving progress
        if: steps.import_source.outcome == 'failure' || steps.refresh_metrics.outcome == 'failure'
        run: exit 1
